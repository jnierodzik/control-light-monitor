# Rules engine for the machine. Subscribes to node state, decides what is worth a
# notification, and logs every transition for later analysis.
#
# Runs as its own process, deliberately separate from the node: a node's job is to say
# what the light is doing, and deciding whether that deserves waking someone up is a
# different concern with different reasons to change.

mqtt:
  host: localhost
  port: 1883
  base_topic: shop/lights        # subscribes to shop/lights/+/{state,health,availability}

ntfy:
  server: https://ntfy.sh
  # ntfy.sh has no accounts, so this topic name IS the only secret: anyone who knows
  # it can read every notification from this shop and publish convincing fakes. It is
  # deliberately a placeholder here. Put the real one in config/rules-pi.local.yaml,
  # which is gitignored and is what `make deploy` sends to the Pi.
  topic: CHANGEME-pick-a-long-random-topic
  # ntfy.sh has no accounts. This topic name is the only thing stopping a stranger
  # reading these notifications or sending convincing fake ones. Treat it as a password:
  # do not paste it into a public issue, screenshot or commit message other than this.

database: ../data/history.sqlite

# The machine's light is an annunciator: it only lights to ask for attention, and latches
# until the operator acts. So `clear` is the normal condition and is not worth saying.
rules:
  - state: error
    title: "Machine fault"
    message: "Red light is on. The system has stopped and needs you."
    priority: high
    tags: [rotating_light]
    cooldown_s: 120           # one notification per fault, not one per flicker
    escalate_after_s: 900     # still unattended after 15 min -> escalate
    escalate_priority: urgent
    escalate_max: 4           # four reminders, then stop nagging

  - state: done
    title: "Machine run complete"
    message: "Green light. The run finished and the system is waiting."
    priority: default
    tags: [white_check_mark]
    cooldown_s: 60

  - state: unknown
    title: "Machine light unreadable"
    message: "The node cannot interpret the light. Check the tap."
    priority: default
    tags: [grey_question]
    cooldown_s: 3600

  # `clear` fires after every single event. Announcing it would double the noise for no
  # information, so it is logged to history and nothing more.
  # Deliberately noisy, and it earns it. Every run is started by hand, so an alert
  # here is the operator confirming the whole chain is alive at the moment they would
  # most notice its absence: lamp, tap, optocoupler, Pi, broker, rules, network, phone.
  # Expecting a buzz and not getting one is a liveness check nothing else provides --
  # the heartbeat watchdog lives on the same Pi as the node it watches, so it cannot
  # report that Pi being dead. This can, via the person standing at the machine.
  #
  # cooldown_s is 0 on purpose: back-to-back runs should each announce themselves, or
  # the check silently stops working exactly when the press is busiest.
  - state: running
    title: "Machine running"
    message: "Green light steady. Run started, monitor is alive."
    priority: default
    tags: [arrow_forward]
    cooldown_s: 0
  - state: clear
    notify: false

quiet_hours:
  enabled: false              # turn on once you know the rhythm of the shop
  start: "22:00"
  end: "06:00"
  override_states: [error]    # a fault at 3am is still a fault

watchdog:
  enabled: true
  heartbeat_timeout_s: 60     # the node heartbeats every 15s
  priority: high
  repeat_s: 1800              # keep saying it every 30 min, not once and forget

# The tap cannot distinguish an unplugged harness from an idle machine -- both are
# "every input dark, forever". This is the only signal we have that it might be deaf
# rather than merely quiet. Enable once you know what a normal working day looks like.
staleness:
  enabled: false
  after_hours: 10
  between: ["07:00", "19:00"]
  priority: default

# What to do when the push itself fails. This matters more here than it looks: the
# light is an annunciator, so the node publishes `error` once on the transition and
# then the lamp just stays lit. Nothing about the machine will ever trigger a second
# attempt, so without this a single failed POST means the alert is gone for good.
#
# Alerts are dropped because a newer state superseded them, not because they got old
# -- a latched red lamp is just as true ten minutes late, and a delivered retry says
# how late it is. max_age_s is only the backstop.
retry:
  enabled: true
  interval_s: 30          # a Wi-Fi blip clears well inside this
  max_age_s: 1800
  max_pending: 32

logging:
  level: INFO
  format: text
