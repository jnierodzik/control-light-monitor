# Deployed rules config for the Pi. Same as config/rules.yaml but pointing at the
# broker and database paths that exist on the node itself.

mqtt:
  host: localhost          # mosquitto runs on the Pi alongside the node
  port: 1883
  base_topic: shop/lights

ntfy:
  server: https://ntfy.sh
  # ntfy.sh has no accounts, so this topic name IS the only secret: anyone who knows
  # it can read every notification from this shop and publish convincing fakes. It is
  # deliberately a placeholder here. Put the real one in config/rules-pi.local.yaml,
  # which is gitignored and is what `make deploy` sends to the Pi.
  topic: CHANGEME-pick-a-long-random-topic

database: /var/lib/stacklight/history.sqlite

# These titles and messages are what lands on your phone. Change them to name the
# machine -- "Annealer fault" rather than "Machine fault". The monitor-health alerts
# (offline, silent, back) are generated in code and use `node_id` from the node config
# instead; see the README.
rules:
  - state: error
    title: "Machine fault"
    message: "Red light is on. The system has stopped and needs you."
    priority: high
    tags: [rotating_light]
    cooldown_s: 120
    escalate_after_s: 900
    escalate_priority: urgent
    escalate_max: 4

  - state: done
    title: "Machine run complete"
    message: "Green light. The run finished and the system is waiting."
    priority: default
    tags: [white_check_mark]
    cooldown_s: 60

  - state: unknown
    title: "Machine light unreadable"
    message: "The node cannot interpret the light. Check the tap."
    priority: default
    tags: [grey_question]
    cooldown_s: 3600

  # Deliberately noisy, and it earns it. Every run is started by hand, so an alert
  # here is the operator confirming the whole chain is alive at the moment they would
  # most notice its absence: lamp, tap, optocoupler, Pi, broker, rules, network, phone.
  # Expecting a buzz and not getting one is a liveness check nothing else provides --
  # the heartbeat watchdog lives on the same Pi as the node it watches, so it cannot
  # report that Pi being dead. This can, via the person standing at the machine.
  #
  # cooldown_s is 0 on purpose: back-to-back runs should each announce themselves, or
  # the check silently stops working exactly when the system is busiest.
  - state: running
    title: "Machine running"
    message: "Green light steady. Run started, monitor is alive."
    priority: default
    tags: [arrow_forward]
    cooldown_s: 0
  - state: clear
    notify: false

quiet_hours:
  enabled: false
  start: "22:00"
  end: "06:00"
  override_states: [error]

watchdog:
  enabled: true
  heartbeat_timeout_s: 60
  priority: high
  repeat_s: 1800

# Note the limitation this exists for: with the broker, the node and the rules engine
# all on the same Pi, a total failure of that Pi takes the watchdog with it. The
# staleness rule is the only in-band signal left, and even it cannot fire from a dead
# machine. Accepted for now; an off-box check is the eventual answer.
staleness:
  enabled: false
  after_hours: 10
  between: ["07:00", "19:00"]
  priority: default

# What to do when the push itself fails. This matters more here than it looks: the
# `error` state latches, so the node publishes it once on the transition and
# then the lamp just stays lit. Nothing about the machine will ever trigger a second
# attempt, so without this a single failed POST means the alert is gone for good.
#
# Alerts are dropped because a newer state superseded them, not because they got old
# -- a latched red lamp is just as true ten minutes late, and a delivered retry says
# how late it is. max_age_s is only the backstop.
retry:
  enabled: true
  interval_s: 30          # a Wi-Fi blip clears well inside this
  max_age_s: 1800
  max_pending: 32

logging:
  level: INFO
  format: text
