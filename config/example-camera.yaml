# industrial machine -- two-segment stack light, red over green.
#
# ROIs and thresholds here are placeholders. Set them with the calibration UI once
# the camera is mounted; do not guess them by hand.

node_id: machine1

mqtt:
  host: localhost
  port: 1883
  base_topic: shop/lights

camera:
  source: picamera
  resolution: [1280, 720]
  # Heavy underexposure is the whole trick: the room goes black and only an
  # energised LED registers. Dial these in visually with the calibration UI.
  exposure_us: 800
  analogue_gain: 1.0
  awb_enable: false
  lens_position: 3.5      # dioptres; 1/metres. 3.5 ~= 29cm. Fixed, never autofocus.
  fps: 15

segments:
  - name: red
    roi: [412, 88, 46, 60]     # x, y, w, h
    threshold: 90
  - name: green
    roi: [412, 152, 46, 60]
    threshold: 90

# A region that must ALWAYS read dark. If it goes bright, the camera has been bumped
# or the lighting changed, and every other reading in the frame is suspect.
dark_reference:
  roi: [300, 400, 40, 40]
  threshold: 60

detection:
  debounce_s: 1.5
  flash_window_s: 2.0
  flash_duty_range: [0.2, 0.8]
  flash_min_transitions: 2

# What the light means, observed on the machine 2026-10-09:
#
#   green steady    a cycle is RUNNING, lit for its whole duration
#   green flashing  the cycle COMPLETED and is waiting to be dismissed
#   red lit         a fault, latched until the operator acts
#   both dark       powered off, or idle between runs
#
# This was originally written up as a pure annunciator -- dark when off, idle and
# running alike, lighting only to ask for attention. True of red, wrong about green,
# and not harmless: both green modes matched `green: "on"` and resolved to `done`, so
# the alert fired when a cycle STARTED and nothing fired when it finished.
#
# The earlier version of this comment said that if blinking turned out to mean
# something distinct from solid, splitting them would be a one-line change. It did,
# and it was.
#
# "on" still matches steady OR flashing, and is used for red, which means a fault
# either way. Note that "on" and "off" must be quoted: YAML 1.1 reads them bare as
# booleans.
# Run `stacklight states config/machine1.yaml` for the full resolution table.
states:
  error:   {red: "on"}                      # a fault wins regardless of green
  done:    {red: "off", green: flashing}    # finished, awaiting the operator
  running: {red: "off", green: steady}      # cycle in progress
  clear:   {red: "off", green: "off"}       # off, or idle between runs

publish:
  heartbeat_s: 15              # health topic cadence; the rules watchdog keys off this
  state_refresh_s: 60          # retained state resent this often even without a change
  snapshot_min_interval_s: 300 # floor between routine snapshots
  snapshot_on_transition: true # plus one on every committed transition, rate limit or not,
                               # so a notification carries the state that triggered it
  snapshot_annotate: true      # outline each ROI and print its measured value
  snapshot_gain: 1.0           # brightens the debug JPEG only; the detector never sees it
  snapshot_max_width: 640
  snapshot_quality: 70

logging:
  level: INFO
  format: text

calibration:
  host: 0.0.0.0
  port: 8080
  sample_dir: ../samples/machine1
