# machine electrical tap: reads the lamp wiring through optocouplers instead of watching
# the light with a camera. Standalone -- there is no camera section because a GPIO node
# needs no camera hardware, no picamera2 and no calibration.
#
# Wiring, via a JST-XH 4-pin pass-through harness at the control box connector:
#
#   Gray   common return  -> opto input ground (NOT the Pi's ground: that would undo
#                            the isolation the optocouplers exist to provide)
#   Green  -> opto ch1 -> GPIO 27
#   Red    -> opto ch2 -> GPIO 17
#   Purple -> opto ch3 -> GPIO 22   (buzzer)

node_id: machine1
sensor: gpio

mqtt:
  host: localhost
  port: 1883
  base_topic: shop/lights

gpio:
  sample_hz: 100        # ~67 samples per cycle of a 1.5Hz blink, against 15fps of video
  # The MT-301R4P-P sources rather than sinks -- the -P is PNP output. It drives the pin
  # HIGH when the lamp lead is energised and holds it low through an on-board pull-down
  # when idle. Measured 2026-10-08: with the Pi pulling up and the board pulling down,
  # every output sat at 1.158V, right on the input threshold, which is why readings
  # flipped at random. Pulling down instead puts idle at a solid 0V.
  active_low: false
  pull: down

segments:
  - name: red
    pin: 17
  - name: green
    pin: 27
  # The purple/buzzer line is NOT tapped. W1 is left empty at the harness -- see
  # docs/parts.md. This machine never drives purple, and a configured segment on an
  # unconnected pin would report `off` forever, which reads as "the buzzer is silent"
  # rather than "nothing is watching it".

detection:
  debounce_s: 1.5
  flash_window_s: 2.0
  flash_duty_range: [0.2, 0.8]
  flash_min_transitions: 2

# Observed on the machine, 2026-10-09. The light was previously documented as a pure
# annunciator -- dark when off, idle and running alike. That was wrong about green:
#
#   green steady    the system is RUNNING. Lit the whole time a cycle is in progress.
#   green flashing  the cycle COMPLETED and is waiting to be dismissed. ~1Hz, 50% duty.
#   red on          fault, latched until the operator acts.
#   all dark        off, or idle between runs.
#
# So "running" is observable after all, and the distinction between running and done is
# carried entirely by steady-vs-flashing on one wire. Collapsing those two with "on"
# was the original bug: it fired "Run complete" the moment a cycle STARTED, and then
# produced no transition at all when the cycle actually finished.
#
# The flashing is generated by the controller pulsing the green wire, not by the lamp --
# this unit is box diagram 2, continuous-only, with no internal flasher. The audible
# click at completion is that relay. Measured duty 0.50 over ~1Hz, comfortably inside
# flash_duty_range with transitions to spare in a 2s window.
#
# "on" matches steady or flashing, and both it and "off" must be quoted -- YAML 1.1
# reads them bare as booleans.
states:
  error:   {red: "on"}                      # a fault wins regardless of green
  done:    {red: "off", green: flashing}    # finished, awaiting the operator
  running: {red: "off", green: steady}      # cycle in progress
  clear:   {red: "off", green: "off"}       # off, or idle between runs

logging:
  level: INFO
  format: text
