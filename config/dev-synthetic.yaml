# Laptop development config: same geometry and thresholds as the machine node, but the
# frames are drawn rather than captured. `make dev` runs against this.

node_id: devnode

mqtt:
  host: localhost
  port: 1883
  base_topic: shop/lights

camera:
  source: synthetic
  resolution: [1280, 720]
  exposure_us: 800
  analogue_gain: 1.0
  awb_enable: false
  lens_position: 3.5
  fps: 15
  synthetic:
    lit_value: 210      # what a lit segment reads at the exposure above
    ambient: 4          # room light bleed
    noise_sigma: 1.5    # sensor read noise
    glow_px: 4          # LED spill past the ROI edge
    flash_hz: 1.5
    flash_duty: 0.5

segments:
  - name: red
    roi: [412, 88, 46, 60]
    threshold: 90
  - name: green
    roi: [412, 152, 46, 60]
    threshold: 90

dark_reference:
  roi: [300, 400, 40, 40]
  threshold: 60

detection:
  debounce_s: 1.5
  flash_window_s: 2.0
  flash_duty_range: [0.2, 0.8]
  flash_min_transitions: 2

# The machine's stack light is an ANNUNCIATOR, not a state indicator.
#
# It is dark when the machine is powered off, when it is idle, AND while it is running.
# Those three are indistinguishable -- "running" is simply not observable from this
# light. It lights only to ask for attention, and latches until the operator acts:
#
#   red lit   -> an error occurred
#   green lit -> a run completed successfully
#
# "on" matches steady OR flashing, because red means error whether or not it blinks.
# The flash mode is still measured and published on every payload, so if blinking turns
# out to mean something distinct from solid, splitting these is a one-line change.
#
# Note that "on" and "off" must be quoted: YAML 1.1 reads them bare as booleans.
# Run `stacklight states config/dev-synthetic.yaml` for the full resolution table.
states:
  error: {red: "on"}                    # error wins if both were ever lit at once
  done:  {red: "off", green: "on"}
  clear: {red: "off", green: "off"}     # nothing pending: off, idle, or mid-run

publish:
  heartbeat_s: 15              # health topic cadence; the rules watchdog keys off this
  state_refresh_s: 60          # retained state resent this often even without a change
  snapshot_min_interval_s: 300 # floor between routine snapshots
  snapshot_on_transition: true # plus one on every committed transition, rate limit or not,
                               # so a notification carries the state that triggered it
  snapshot_annotate: true      # outline each ROI and print its measured value
  snapshot_gain: 1.0           # brightens the debug JPEG only; the detector never sees it
  snapshot_max_width: 640
  snapshot_quality: 70

logging:
  level: DEBUG
  format: text

calibration:
  port: 8080
  sample_dir: ../samples/dev
